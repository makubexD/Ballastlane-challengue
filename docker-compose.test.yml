services:
  postgres_test:
    image: postgres:16-alpine
    container_name: ballastlane_db_test
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TEST_DB_NAME:-ballastlane_test}
      POSTGRES_USER: ${TEST_DB_USER:-ballastlane_test}
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:-ballastlane_test}
    ports:
      - "${TEST_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEST_DB_USER:-ballastlane_test} -d ${TEST_DB_NAME:-ballastlane_test}"]
      interval: 5s
      timeout: 3s
      retries: 10
