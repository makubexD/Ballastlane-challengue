<div class="max-w-2xl mx-auto p-4" data-testid="task-list-page">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-xl font-bold text-gray-900">Tasks</h1>
    @if (!showForm() && !editingTask()) {
      <button
        type="button"
        class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-lg hover:bg-blue-700 transition-colors"
        data-testid="new-task-button"
        (click)="showForm.set(true)"
      >
        New task
      </button>
    }
  </div>

  @if (showForm() && !editingTask()) {
    <div class="mb-4" data-testid="create-form-wrapper">
      <app-task-form
        [task]="null"
        (formSubmit)="onCreateSubmit($event)"
        (formCancel)="showForm.set(false)"
      />
    </div>
  }

  @if (editingTask()) {
    <div class="mb-4" data-testid="edit-form-wrapper">
      <app-task-form
        [task]="editingTask()"
        (formSubmit)="onEditSubmit($event)"
        (formCancel)="editingTask.set(null)"
      />
    </div>
  }

  @if (taskService.isLoading()) {
    <app-spinner />
  } @else if (taskService.tasks().length === 0) {
    <app-empty-state
      message="No tasks yet."
      actionLabel="Create your first task"
      (action)="showForm.set(true)"
    />
  } @else {
    <div class="space-y-3" data-testid="task-cards-container">
      @for (task of taskService.tasks(); track task.id) {
        <app-task-card
          [task]="task"
          (editTask)="onEditTask($event)"
          (deleteTask)="onDeleteTask($event)"
        />
      }
    </div>
  }
</div>
